name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: heylong7
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            svgs/github-contribution-grid-snake.svg
            svgs/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Save generated SVGs to temp location
          cp -r svgs /tmp/svgs
          
          # Create or switch to output branch and clean it
          git fetch origin output 2>/dev/null || true
          git checkout output 2>/dev/null || git checkout --orphan output
          git rm -rf . 2>/dev/null || true
          
          # Copy SVGs into the branch root
          cp /tmp/svgs/*.svg .
          
          # Commit and push
          git add *.svg
          git commit -m "Update snake contribution graph" --allow-empty
          git push origin output --force
